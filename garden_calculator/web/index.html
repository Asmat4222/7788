<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- SEO -->
  <meta name="description"
    content="GrowVault — a premium calculator suite for Grow a Garden. Instantly compute crop values, stack mutation multipliers, browse the crop database and estimate pet value.">
  <meta name="keywords"
    content="grow a garden calculator, crop value calculator, mutation calculator, grow a garden values, garden calculator">
  <meta name="theme-color" content="#0B1220">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="GrowVault — Grow a Garden Calculator Suite">
  <meta property="og:description"
    content="Compute crop values, stack mutations and browse the full crop database with a modern, premium interface.">

  <link rel="manifest" href="manifest.json">
  <title>GrowVault — Grow a Garden Calculator</title>

  <style>
    /* First-paint splash so the page never flashes white while Flutter boots */
    html, body { margin: 0; padding: 0; height: 100%; background: #0B1220; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px; font-family: system-ui, -apple-system, sans-serif;
      color: #E2E8F0; background: radial-gradient(1200px 600px at 50% -10%, #113a2e 0%, #0B1220 60%);
    }
    #boot .logo {
      width: 68px; height: 68px; border-radius: 20px;
      background: linear-gradient(135deg, #34D399, #059669);
      display: flex; align-items: center; justify-content: center; font-size: 34px;
      box-shadow: 0 20px 60px rgba(16,185,129,0.35);
    }
    #boot .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.15); border-top-color: #34D399;
      animation: spin 0.9s linear infinite;
    }
    #boot .label { font-size: 14px; letter-spacing: 0.08em; opacity: 0.7; text-transform: uppercase; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="logo">🌱</div>
    <div class="spinner"></div>
    <div class="label">Loading GrowVault</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) { boot.style.transition = 'opacity .35s ease'; boot.style.opacity = '0';
        setTimeout(function () { boot.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
