name: garden_calculator
description: "GrowVault — a premium Flutter Web calculator suite for the Grow a Garden universe (crop value, mutation stacking, pet value and more)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State management
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.2.0
  # Persistence (theme, favourites, recent calculations)
  shared_preferences: ^2.2.3
  # Formatting
  intl: ^0.19.0
  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
