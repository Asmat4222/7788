<!-- GrowVault FULL toolkit widget - paste this ENTIRE block into a WordPress "Custom HTML" block -->
<style>
  #gv, #gv * { box-sizing:border-box; }
  #gv {
    --emerald:#10B981;--emerald-l:#34D399;--emerald-d:#059669;--gold:#F59E0B;--gold-l:#FBBF24;
    --violet:#8B5CF6;--sky:#38BDF8;--rose:#F43F5E;--blue:#60A5FA;
    --bg:#0B1220;--surface:#111C2E;--surface-2:#16233A;--border:#223048;--text:#E2E8F0;--muted:#94A3B8;
    --r:14px;--r-lg:24px;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1100px 560px at 50% -12%,#14493a 0%,rgba(11,18,32,0) 60%),var(--bg);
    padding:24px 16px 60px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
  }
  #gv.light{--bg:#F3F7F5;--surface:#fff;--surface-2:#EAF2EE;--border:#DCE7E1;--text:#0F1B15;--muted:#5B6B62;
    background:radial-gradient(1100px 560px at 50% -12%,#d6efe3 0%,rgba(243,247,245,0) 60%),var(--bg);}
  #gv .wrap{max-width:1160px;margin:0 auto;}
  #gv h1,#gv h2,#gv h3{font-family:'Plus Jakarta Sans',sans-serif;margin:0;letter-spacing:-.2px;}
  #gv .top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  #gv .logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;
    background:linear-gradient(135deg,var(--emerald-l),var(--emerald-d));box-shadow:0 14px 40px rgba(16,185,129,.4);}
  #gv .brand b{font-size:21px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;}
  #gv .brand span{display:block;color:var(--muted);font-size:12.5px;}
  #gv .sp{flex:1;}
  #gv .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:11px;
    padding:9px 13px;cursor:pointer;font-weight:600;font-size:13px;}
  #gv .btn:hover{border-color:var(--emerald);}

  /* nav */
  #gv .nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px;}
  #gv .nav button{border:1px solid var(--border);background:var(--surface);color:var(--muted);
    padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px;transition:.15s;white-space:nowrap;}
  #gv .nav button.on{color:var(--emerald-l);border-color:var(--emerald);background:rgba(16,185,129,.12);}

  #gv .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start;}
  #gv .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  #gv .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:900px){#gv .grid,#gv .grid3,#gv .grid2{grid-template-columns:1fr;}}
  #gv .card{background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--border);
    border-radius:var(--r-lg);padding:22px;backdrop-filter:blur(14px);}
  #gv .card.tap{cursor:pointer;transition:.18s;}
  #gv .card.tap:hover{transform:translateY(-5px);box-shadow:0 22px 50px rgba(0,0,0,.28);}
  #gv .lab{font-weight:700;font-size:14px;margin:0 0 9px;font-family:'Plus Jakarta Sans',sans-serif;}
  #gv .muted{color:var(--muted);}
  #gv .field{margin-bottom:20px;}
  #gv .rowb{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  #gv select,#gv input[type=number],#gv input[type=text]{width:100%;background:var(--surface-2);color:var(--text);
    border:1px solid var(--border);border-radius:11px;padding:12px 13px;font-size:14.5px;font-weight:600;outline:none;}
  #gv select:focus,#gv input:focus{border-color:var(--emerald);}
  #gv input[type=range]{width:100%;accent-color:var(--emerald);}
  #gv .link{background:none;border:none;color:var(--emerald-l);cursor:pointer;font-weight:700;font-size:12.5px;}
  #gv .step{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;}
  #gv .step button{flex:0 0 44px;height:46px;background:none;border:none;color:var(--emerald-l);font-size:21px;cursor:pointer;}
  #gv .step input{border:none;background:none;text-align:center;font-size:17px;}
  #gv .chips{display:flex;flex-wrap:wrap;gap:8px;}
  #gv .chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;border:1px solid var(--border);
    background:color-mix(in srgb,var(--surface-2) 60%,transparent);padding:8px 12px;border-radius:11px;font-weight:700;font-size:12.5px;transition:.15s;}
  #gv .chip .m{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.07);}
  #gv .chip.on{border-width:1.6px;}
  #gv .cat{font-size:10.5px;letter-spacing:1px;font-weight:800;color:var(--muted);margin:13px 0 8px;display:flex;align-items:center;gap:8px;}
  #gv .dot{width:8px;height:8px;border-radius:50%;}
  #gv .hero{border-radius:18px;padding:22px;border:1px solid var(--border);background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(245,158,11,.14));}
  #gv .hero.cos{background:linear-gradient(135deg,var(--violet),var(--sky));border:none;}
  #gv .eyebrow{font-size:11.5px;letter-spacing:1.4px;font-weight:800;color:var(--muted);}
  #gv .hero.cos .eyebrow{color:rgba(255,255,255,.82);}
  #gv .big{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:40px;line-height:1.05;color:var(--gold-l);word-break:break-word;}
  #gv .hero.cos .big{color:#fff;}
  #gv .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  #gv .stat{background:color-mix(in srgb,var(--surface-2) 55%,transparent);border:1px solid var(--border);border-radius:14px;padding:13px;}
  #gv .stat .k{font-size:10.5px;letter-spacing:.7px;font-weight:700;color:var(--muted);text-transform:uppercase;}
  #gv .stat .v{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px;margin-top:4px;}
  #gv .formula{margin-top:16px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface-2) 50%,transparent);border:1px solid var(--border);border-radius:11px;padding:12px;}
  #gv table{width:100%;border-collapse:collapse;font-size:13.5px;}
  #gv th,#gv td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--border);}
  #gv th{color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;}
  #gv td.r,#gv th.r{text-align:right;}
  #gv .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid;}
  #gv .timer{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:26px;color:var(--emerald-l);}
  #gv .subnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
  #gv .subnav button{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12.5px;}
  #gv .subnav button.on{color:var(--emerald-l);border-color:var(--emerald);}
  #gv .hidden{display:none!important;}
  #gv .tradecol{min-height:120px;display:flex;flex-direction:column;gap:8px;}
  #gv .titem{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:8px 10px;font-size:13px;}
  #gv .titem b{margin-left:auto;color:var(--gold-l);}
  #gv .titem .x{cursor:pointer;color:var(--rose);font-weight:800;}
  #gv .verdict{border-radius:16px;padding:18px;text-align:center;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;margin-top:12px;border:1px solid var(--border);}
  #gv .search{margin-bottom:14px;}
  #gv .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;}
  #gv .note{font-size:12px;color:var(--muted);background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);border-radius:11px;padding:11px 13px;margin-bottom:16px;}
</style>

/* ============================ SHARED CALC ============================ */
function envTerm(list){if(!list.length)return 1;var s=list.reduce(function(a,m){return a+m.mult;},0);return 1+s-list.length;}
function cropValue(crop,weight,growth,envList,fb,qty){
 var bw=crop.weight<=0?1:crop.weight,ratio=Math.max(weight/bw,0.1),w=ratio*ratio;
 var g=growth?growth.mult:1,e=envTerm(envList),tot=g*e,f=1+(fb||0)/100;
 var single=crop.value*w*tot*f;return{single:single,total:single*(qty||1),w:w,g:g,e:e,tot:tot,f:f};
}
function combined(list){var g=list.filter(function(m){return m.id==='gold'||m.id==='rainbow';});var e=list.filter(function(m){return m.id!=='gold'&&m.id!=='rainbow';});var gm=g.reduce(function(a,m){return a*m.mult;},1);return gm*envTerm(e);}

function chipEl(m,on){var e=el('div','chip'+(on?' on':''));e.style.borderColor=on?m.color:'var(--border)';if(on){e.style.background=m.color+'2e';e.style.color=m.color;}e.innerHTML=(on?'✓ ':'')+'<span>'+m.name+'</span><span class="m" style="color:'+m.color+'">×'+m.mult+'</span>';return e;}

/* ============================ SHARED CALC ============================ */
function envTerm(list){if(!list.length)return 1;var s=list.reduce(function(a,m){return a+m.mult;},0);return 1+s-list.length;}
function cropValue(crop,weight,growth,envList,fb,qty){
 var bw=crop.weight<=0?1:crop.weight,ratio=Math.max(weight/bw,0.1),w=ratio*ratio;
 var g=growth?growth.mult:1,e=envTerm(envList),tot=g*e,f=1+(fb||0)/100;
 var single=crop.value*w*tot*f;return{single:single,total:single*(qty||1),w:w,g:g,e:e,tot:tot,f:f};
}
function combined(list){var g=list.filter(function(m){return m.id==='gold'||m.id==='rainbow';});var e=list.filter(function(m){return m.id!=='gold'&&m.id!=='rainbow';});var gm=g.reduce(function(a,m){return a*m.mult;},1);return gm*envTerm(e);}

function chipEl(m,on){var e=el('div','chip'+(on?' on':''));e.style.borderColor=on?m.color:'var(--border)';if(on){e.style.background=m.color+'2e';e.style.color=m.color;}e.innerHTML=(on?'✓ ':'')+'<span>'+m.name+'</span><span class="m" style="color:'+m.color+'">×'+m.mult+'</span>';return e;}

 var st={crop:CROPS[0],w:CROPS[0].weight,q:1,g:null,e:{},fb:0,follow:true};

build.trade=function(){
 var p=$('#page-trade');
 var CAT=CROPS.concat(PETS).concat(GEAR).concat(EGGS);
 p.innerHTML='<div class="note">Add items to each side. Crop values use base weight &amp; no mutations (a fair baseline). Verdict compares totals.</div>'+
  '<div class="grid2">'+
   sideHTML('A','Your offer')+sideHTML('B','Their offer')+
  '</div><div id="tVerdict"></div>';
 function sideHTML(k,title){return '<div class="card"><h3 style="font-size:16px;margin-bottom:12px">'+title+'</h3>'+
   '<div style="display:flex;gap:8px;margin-bottom:10px"><select id="tSel'+k+'" style="flex:1"></select><div class="step" style="flex:0 0 120px"><button data-k="'+k+'" class="tqd">−</button><input type="number" id="tQ'+k+'" value="1" min="1"><button data-k="'+k+'" class="tqi">+</button></div></div>'+
   '<button class="btn tadd" data-k="'+k+'" style="width:100%;margin-bottom:12px">+ Add to '+title+'</button>'+
   '<div class="tradecol" id="tCol'+k+'"></div>'+
   '<div class="rowb" style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px"><span class="lab" style="margin:0">Side total</span><span class="lab" style="margin:0;color:var(--gold-l)" id="tTot'+k+'">0 🪙</span></div></div>';}
 var sides={A:[],B:[]};
 ['A','B'].forEach(function(k){var s=$('#tSel'+k);CAT.forEach(function(it){var iv=itemValue(it);var o=el('option',null,(it.emoji||'•')+'  '+it.name+' — '+compact(iv)+' ('+it.kind+')');o.value=it.kind+':'+it.id;s.appendChild(o);});});
 function itemValue(it){if(it.kind==='crop')return cropValue(it,it.weight,null,[],0,1).single;return it.value;}
 function find(v){var parts=v.split(':');return CAT.find(function(it){return it.kind===parts[0]&&it.id===parts[1];});}
 function render(k){var col=$('#tCol'+k);col.innerHTML='';if(!sides[k].length){col.innerHTML='<div class="muted" style="font-size:12.5px;padding:8px">No items yet.</div>';}
   sides[k].forEach(function(row,i){var iv=itemValue(row.it)*row.q;var t=el('div','titem',(row.it.emoji||'•')+' '+row.it.name+(row.q>1?' ×'+row.q:'')+' <b>'+compact(iv)+' 🪙</b> <span class="x">✕</span>');t.querySelector('.x').onclick=function(){sides[k].splice(i,1);render(k);verdict();};col.appendChild(t);});
   var tot=sides[k].reduce(function(a,r){return a+itemValue(r.it)*r.q;},0);$('#tTot'+k).textContent=fmt(tot)+' 🪙';}
 p.querySelectorAll('.tadd').forEach(function(b){b.onclick=function(){var k=b.dataset.k;var it=find($('#tSel'+k).value);var q=Math.max(1,parseInt($('#tQ'+k).value||'1',10));sides[k].push({it:it,q:q});render(k);verdict();};});
 p.querySelectorAll('.tqd').forEach(function(b){b.onclick=function(){var i=$('#tQ'+b.dataset.k);i.value=Math.max(1,(+i.value||1)-1);};});
 p.querySelectorAll('.tqi').forEach(function(b){b.onclick=function(){var i=$('#tQ'+b.dataset.k);i.value=(+i.value||1)+1;};});
 function verdict(){var a=sides.A.reduce(function(s,r){return s+itemValue(r.it)*r.q;},0);var b=sides.B.reduce(function(s,r){return s+itemValue(r.it)*r.q;},0);var box=$('#tVerdict');if(!a&&!b){box.innerHTML='';return;}var diff=b-a;var pct=a>0?Math.round((diff/a)*100):(b>0?100:0);var label,col;var ad=Math.abs(pct);if(ad<=8){label='FAIR TRADE';col='#F59E0B';}else if(diff>0){label='YOU WIN +'+pct+'%';col='#34D399';}else{label='YOU LOSE '+pct+'%';col='#F43F5E';}box.innerHTML='<div class="verdict" style="color:'+col+';border-color:'+col+'55;background:'+col+'14">'+label+'<div class="muted" style="font-size:13px;font-weight:600;margin-top:6px">Your side '+fmt(a)+' 🪙 vs their side '+fmt(b)+' 🪙</div></div>';}
 render('A');render('B');verdict();
};

  '<div class="card"><h3 style="font-size:16px;margin-bottom:12px">All eggs</h3><div style="overflow-x:auto"><table><thead><tr><th></th><th>Egg</th><th class="r">Hatch</th><th class="r">Cost</th></tr></thead><tbody>'+
  EGGS.map(function(e){return '<tr><td style="font-size:20px">'+e.emoji+'</td><td><b>'+e.name+'</b></td><td class="r">'+e.hatch+' min</td><td class="r muted">'+compact(e.value)+' 🪙</td></tr>';}).join('')+'</tbody></table></div></div></div>';

   $('#eOut').innerHTML='<div class="hero"><div style="font-size:40px">'+e.emoji+'</div><h2 style="margin-top:6px">'+e.name+'</h2><div class="muted" style="margin-top:4px">Hatch time: <b>'+e.hatch+' min</b> · Cost: '+compact(e.value)+' 🪙</div></div>'+
     '<h3 style="font-size:14px;margin:16px 0 8px">Possible pets</h3><table><tbody>'+rows+'</tbody></table>';}
 $('#eSel').onchange=eout;eout();
};

build.db=function(){
 var p=$('#page-db');
 p.innerHTML='<div class="subnav" id="dbNav"></div><div id="dbBody"></div>';
 var tabs=[['crops','Crops'],['pets','Pets'],['gear','Gear'],['eggs','Eggs']];
 var nav=$('#dbNav');var cur='crops';
 tabs.forEach(function(t){var b=el('button',t[0]===cur?'on':'',t[1]);b.onclick=function(){cur=t[0];nav.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');rbody();};nav.appendChild(b);});
 function rbody(){var b=$('#dbBody');
   if(cur==='crops'){b.innerHTML='<div class="card"><input class="search" type="text" id="dbQ" placeholder="Search crops…"><div style="overflow-x:auto"><table><thead><tr><th></th><th>Crop</th><th>Rarity</th><th class="r">Base value</th><th class="r">Base weight</th></tr></thead><tbody id="dbT"></tbody></table></div></div>';
     var draw=function(q){var list=CROPS.filter(function(c){return c.name.toLowerCase().indexOf((q||'').toLowerCase())>=0;}).sort(function(a,b){return b.value-a.value;});$('#dbT').innerHTML=list.map(function(c){return '<tr><td style="font-size:20px">'+c.emoji+'</td><td><b>'+c.name+'</b></td><td><span class="pill" style="color:'+RAR[c.rarity][1]+';border-color:'+RAR[c.rarity][1]+'66">'+RAR[c.rarity][0]+'</span></td><td class="r"><b style="color:var(--gold-l)">'+fmt(c.value)+'</b></td><td class="r muted">'+c.weight+' kg</td></tr>';}).join('')||'<tr><td colspan="5" class="muted">No crops found.</td></tr>';};
     $('#dbQ').oninput=function(){draw(this.value);};draw('');}
   else if(cur==='pets'){b.innerHTML='<div class="card"><div style="overflow-x:auto"><table><thead><tr><th></th><th>Pet</th><th>Rarity</th><th>Ability</th><th class="r">Base value</th></tr></thead><tbody>'+PETS.slice().sort(function(a,b){return b.value-a.value;}).map(function(pt){return '<tr><td style="font-size:20px">'+pt.emoji+'</td><td><b>'+pt.name+'</b></td><td><span class="pill" style="color:'+RAR[pt.rarity][1]+';border-color:'+RAR[pt.rarity][1]+'66">'+RAR[pt.rarity][0]+'</span></td><td class="muted" style="font-size:12px">'+pt.ability+'</td><td class="r"><b style="color:var(--gold-l)">'+compact(pt.value)+'</b></td></tr>';}).join('')+'</tbody></table></div></div>';}
   else if(cur==='gear'){b.innerHTML='<div class="card"><div style="overflow-x:auto"><table><thead><tr><th></th><th>Gear</th><th>Effect</th><th class="r">Price</th></tr></thead><tbody>'+GEAR.map(function(g){return '<tr><td style="font-size:20px">'+g.emoji+'</td><td><b>'+g.name+'</b></td><td class="muted" style="font-size:12px">'+g.effect+'</td><td class="r"><b style="color:var(--gold-l)">'+compact(g.value)+'</b></td></tr>';}).join('')+'</tbody></table></div></div>';}
   else{b.innerHTML='<div class="card"><div style="overflow-x:auto"><table><thead><tr><th></th><th>Egg</th><th class="r">Hatch</th><th class="r">Cost</th><th>Top pet</th></tr></thead><tbody>'+EGGS.map(function(e){var top=e.pool.slice().sort(function(a,b){return b[1]-a[1];})[0];return '<tr><td style="font-size:20px">'+e.emoji+'</td><td><b>'+e.name+'</b></td><td class="r">'+e.hatch+' min</td><td class="r muted">'+compact(e.value)+'</td><td class="muted" style="font-size:12px">'+top[0]+' ('+top[1]+'%)</td></tr>';}).join('')+'</tbody></table></div></div>';}
 }
 rbody();
};

/* ============================ CLOCK / TIMERS ============================ */
var clockOn=false;
function pad(n){return (n<10?'0':'')+n;}
function nextIn(intMin){var now=Date.now();var period=intMin*60000;var rem=period-(now%period);return rem;}
function human(ms){var s=Math.floor(ms/1000);var h=Math.floor(s/3600);s-=h*3600;var m=Math.floor(s/60);s-=m*60;return (h>0?h+':':'')+pad(m)+':'+pad(s);}
function tick(){
 document.querySelectorAll('#gv [data-int]').forEach(function(node){var i=parseFloat(node.getAttribute('data-int'));node.textContent=human(nextIn(i));});
 var ds=$('#dashSeed'),de=$('#dashEgg');if(ds)ds.textContent=human(nextIn(5));if(de)de.textContent=human(nextIn(30));
}
function startClock(){if(clockOn)return;clockOn=true;tick();setInterval(tick,1000);}

$('#themeBtn').onclick=function(){var g=$('#gv');g.classList.toggle('light');g.classList.toggle('dark');};
build.dash();built.dash=true;show('dash');
})();
